<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PurpleLive</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title">💜 PurpleLive</h1>
        {% if error %}<p class="error-msg">{{ error }}</p>{% endif %}
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required class="auth-input">
            <input type="password" name="password" placeholder="Password" required class="auth-input">
            <button type="submit" class="auth-btn">🔐 Login</button>
        </form>
        <a href="/signup" class="auth-link">Don't have an account? Sign Up →</a>
    </div>
</body>
</html>
