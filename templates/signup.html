<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PurpleLive</title>
    <link rel="icon" type="image/png" href="/static/purplelive-log/logo.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h1 class="auth-title">💜 PurpleLive</h1>
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="/static/purplelive-log/logo.png" alt="PurpleLive" style="max-width: 220px; height: auto;">
        </div>
        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}
        <form action="/signup" method="POST">
            <input type="text" name="username" placeholder="Choose Username" required class="auth-input">
            <input type="email" name="email" placeholder="Your Email" required class="auth-input">
            <input type="password" name="password" placeholder="Choose Password" required class="auth-input">
            <button type="submit" class="auth-btn">✨ Create Account</button>
        </form>
        <a href="/" class="auth-link">← Back to Login</a>
    </div>
</body>
</html>
